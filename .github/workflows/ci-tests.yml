name: ci-tests

on:
  pull_request:
    paths-ignore:
      - "docs/**"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main

jobs:
  ci-tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Task
        uses: arduino/setup-task@v3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Go 1.27.x
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Build project
        run: corepack enable && task build

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Run Tests
        run: go test -v $(go list ./... | grep -v /node_modules/)
